services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studyground-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studyground
      POSTGRES_USER: studyground
      POSTGRES_PASSWORD: studyground
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
